<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>封面 — {{项目名称}}</title>
  <style>
    __FONT_CSS__
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #f5f5f5; }
    body { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 12px; background: #f5f5f5; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { size: A4; margin: 0; }
    .cover {
      width: 100%;
      min-height: 100vh;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 48px;
    }
    .cover-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 48px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      border-top: 4px solid var(--border-accent, #e8740c);
    }
    .cover-logo-box {
      width: 72px;
      height: 72px;
      border: 2px solid var(--border-accent, #e8740c);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
    }
    .cover-logo-box svg { width: 40px; height: 40px; }
    .cover-title {
      font-size: 32px;
      font-weight: 200;
      letter-spacing: 0.08em;
      line-height: 1.2;
      color: var(--text-primary, #0a0a0a);
      margin-bottom: 12px;
    }
    .cover-subtitle {
      font-size: 14px;
      font-weight: 300;
      color: var(--text-muted, #888);
      letter-spacing: 0.02em;
      margin-bottom: 40px;
    }
    .cover-divider {
      width: 48px;
      height: 2px;
      background: var(--border-accent, #e8740c);
      margin: 0 auto 32px;
    }
    .cover-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 32px;
      text-align: left;
    }
    .cover-info-row {
      font-size: 13px;
      display: flex;
      align-items: baseline;
    }
    .cover-info-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.5;
      min-width: 64px;
    }
    .cover-info-value {
      border-bottom: 1px solid var(--border-light, #e0e0e0);
      padding-bottom: 2px;
      margin-left: 8px;
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="cover-card">
      <div class="cover-logo-box">
        <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><path d="M860.042971 96.065829c32.021943 0 59.757714 27.9552 59.757715 60.269714 0 32.299886-24.137143 56.992914-56.173715 56.992914H423.687314c-32.021943 0-57.973029-26.2144-57.973028-58.514286 0-32.314514 25.936457-58.514286 57.973028-58.514285h433.298286m6.641371-58.514286H423.687314c-64.234057 0-116.487314 52.501943-116.487314 117.028571s52.253257 117.028571 116.487314 117.028572h439.939657c64.234057 0 116.487314-52.501943 116.487315-117.028572s-52.253257-117.028571-116.487315-117.028571zM157.871543 96.3584c32.021943 0 59.757714 27.677257 59.757714 59.991771 0 32.299886-24.137143 56.992914-56.173714 56.992915h-1.082514c-32.021943 0-57.973029-26.2144-57.973029-58.514286 0-32.314514 25.936457-58.514286 57.973029-58.514286h-5.558858m6.641372-58.528914h-1.082514c-64.234057 0-116.487314 52.501943-116.487315 117.028571s52.253257 117.028571 116.487315 117.028572h1.082514c64.234057 0 116.487314-52.501943 116.487314-117.028572s-52.253257-117.028571-116.487314-117.028571z" fill="currentColor"/></svg>
      </div>
      <div class="cover-title">工程量清单报价表</div>
      <div class="cover-subtitle">Price List — RM Design</div>
      <div class="cover-divider"></div>
      <div class="cover-info-grid">
        <div class="cover-info-row">
          <span class="cover-info-label">工程名称</span>
          <span class="cover-info-value">{{项目名称}}</span>
        </div>
        <div class="cover-info-row">
          <span class="cover-info-label">工程编号</span>
          <span class="cover-info-value">{{工程编号}}</span>
        </div>
        <div class="cover-info-row">
          <span class="cover-info-label">编制日期</span>
          <span class="cover-info-value">{{编制日期}}</span>
        </div>
        {{#if 编制人员}}
        <div class="cover-info-row">
          <span class="cover-info-label">编制人员</span>
          <span class="cover-info-value">{{编制人员}}</span>
        </div>
        {{/if}}
        {{#if 联系邮箱}}
        <div class="cover-info-row">
          <span class="cover-info-label">联系邮箱</span>
          <span class="cover-info-value">{{联系邮箱}}</span>
        </div>
        {{/if}}
      </div>
    </div>
  </div>
</body>
</html>
