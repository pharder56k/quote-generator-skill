<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>封面 — {{项目名称}}</title>
  <style>
    __FONT_CSS__
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #002FA7; }
    body {
      font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 12px;
      background: #002FA7;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    @page { size: A4; margin: 0; background: #002FA7; }

    .cover {
      width: 210mm;
      min-height: 297mm;
      background: #002FA7;
      color: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: 'JetBrains Mono', monospace;
    }
    .cover-title {
      font-size: 38px;
      font-weight: 200;
      letter-spacing: -0.025em;
      line-height: 0.94;
      color: inherit;
    }
    .cover-logo-box {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .cover-logo-box svg { width: 64px; height: 64px; }
    .cover-subtitle {
      font-size: 15px;
      font-weight: 300;
      color: rgba(255,255,255,0.7);
      letter-spacing: -0.005em;
    }
    .cover-top {
      position: absolute;
      top: 40px;
      left: 60px;
      right: 60px;
      display: flex;
      justify-content: flex-start;
    }
    .cover-brand {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.65;
    }
    .cover-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 60px 60px;
    }
    .cover-bottom {
      border-top: 1px solid rgba(255,255,255,0.2);
      padding: 24px 60px 40px;
      color: #fff;
    }
    .cover-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 50px;
    }
    .cover-info-row {
      font-size: 13px;
      display: flex;
      align-items: baseline;
    }
    .cover-info-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.55;
      min-width: 72px;
    }
    .cover-info-value {
      border-bottom: 1px solid rgba(255,255,255,0.25);
      padding-bottom: 2px;
      margin-left: 8px;
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="cover-top">
      <div class="cover-brand">RM DESIGN</div>
    </div>
    <div class="cover-main">
      <div class="cover-logo-box">

      </div>
      <div class="cover-title">工程量清单报价表</div>
      <div class="cover-subtitle">Price List — RM Design</div>
    </div>
    <div class="cover-bottom">
      <div class="cover-info-grid">
        <div class="cover-info-row">
          <span class="cover-info-label">工程名称</span>
          <span class="cover-info-value">{{项目名称}}</span>
        </div>
        <div class="cover-info-row">
          <span class="cover-info-label">工程编号</span>
          <span class="cover-info-value">{{工程编号}}</span>
        </div>
        <div class="cover-info-row">
          <span class="cover-info-label">编制日期</span>
          <span class="cover-info-value">{{编制日期}}</span>
        </div>
        {{#if 编制人员}}
        <div class="cover-info-row">
          <span class="cover-info-label">编制人员</span>
          <span class="cover-info-value">{{编制人员}}</span>
        </div>
        {{/if}}
        {{#if 联系邮箱}}
        <div class="cover-info-row">
          <span class="cover-info-label">联系邮箱</span>
          <span class="cover-info-value">{{联系邮箱}}</span>
        </div>
        {{/if}}
      </div>
    </div>
  </div>
</body>
</html>
